<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件浏览器</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="webbrowser.css">
    <!-- 响应式与全屏布局(在 webbrowser.css 之后加载覆盖,原 CSS 不做改动) -->
    <style>
        html, body { height: 100%; overflow: hidden; }
        body { padding: 0 !important; }
        .browser {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            border-radius: 0;
            box-shadow: none;
        }
        .sidebar-backdrop { display: none; }
        .sidebar-toggle-btn { display: none !important; }
        @media (max-width: 1100px) {
            .browser .sidebar { width: 220px; }
        }
        @media (max-width: 768px) {
            .browser .sidebar {
                position: fixed;
                left: 0; top: 0; bottom: 0;
                width: 260px;
                z-index: 2000;
                transform: translateX(-100%);
                transition: transform 0.25s ease;
                box-shadow: 0 0 40px rgba(0, 0, 0, 0.15);
            }
            .browser.sidebar-open .sidebar { transform: translateX(0); }
            .browser.sidebar-open .sidebar-backdrop {
                display: block;
                position: fixed;
                inset: 0;
                background: rgba(15, 23, 42, 0.35);
                z-index: 1900;
            }
            .sidebar-toggle-btn { display: flex !important; }
            .main { padding: 14px 12px !important; }
            .search-box input { width: 120px !important; }
            .breadcrumb { flex-wrap: nowrap; overflow-x: auto; max-width: 42vw; }
            .breadcrumb-item { white-space: nowrap; }
        }
        @media (max-width: 640px) {
            .list-header, .file-row { grid-template-columns: 1fr 84px; }
            .list-header .col-type, .list-header .col-size,
            .file-row .type-cell, .file-row .size-cell { display: none; }
        }
    </style>
</head>
<body>
